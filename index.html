    <script>
      // Compatibility shim: Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // when third-party libraries, extensions, or preview proxies patch window.fetch.
      (function() {
        try {
          var currentFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = typeof fn === 'function' ? fn.bind(window) : fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property cannot be redefined
        }
      })();
    </script>
